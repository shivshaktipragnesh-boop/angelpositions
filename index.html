<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Angel One – Glasses</title>
<style>
  /* Black = transparent on additive displays, so keep the background pure black and text high-contrast */
  :root { --green:#3ddc84; --red:#ff5c5c; --amber:#ffc247; --dim:#9aa0a6; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #000; color: #fff; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; user-select: none; }
  #app { height: 100%; max-width: 600px; max-height: 600px; margin: 0 auto; padding: 18px 22px;
    display: flex; flex-direction: column; }
  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  header h1 { font-size: 26px; font-weight: 700; letter-spacing: .5px; }
  header span { font-size: 20px; color: var(--dim); }
  main { flex: 1; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
  footer { display: flex; justify-content: space-between; font-size: 18px; color: var(--dim); padding-top: 8px; }
  .up { color: var(--green); } .down { color: var(--red); } .warn { color: var(--amber); } .dim { color: var(--dim); }

  .big { margin: auto 0; text-align: center; }
  .big .label { font-size: 24px; color: var(--dim); margin-bottom: 8px; }
  .big .value { font-size: 64px; font-weight: 800; line-height: 1.1; }
  .big .sub { font-size: 24px; margin-top: 18px; color: var(--dim); }

  .row { border-bottom: 1px solid #2a2a2a; padding: 6px 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .row .l { min-width: 0; }
  .row .sym { font-size: 26px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .meta { font-size: 19px; color: var(--dim); margin-top: 2px; }
  .row .r { text-align: right; white-space: nowrap; }
  .row .pnl { font-size: 26px; font-weight: 700; }
  .row .tag { font-size: 19px; margin-top: 2px; text-transform: capitalize; }
  .msg { margin: auto 0; text-align: center; font-size: 26px; color: var(--dim); line-height: 1.4; }
</style>
</head>
<body>
<div id="app">
  <header><h1 id="title">Angel One</h1><span id="clock"></span></header>
  <main id="main"><div class="msg">Loading…</div></main>
  <footer><span id="hint">‹ swipe / tap ›</span><span id="pager"></span></footer>
</div>

<script>
(function () {
  var PER_PAGE = 20;
  var REFRESH_MS = 10000;
  var mem = {};
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k) || mem[k]; localStorage.setItem(k, v); } catch (e) { if (v !== undefined) mem[k] = v; else return mem[k]; } }

  // First visit: open https://your-app.vercel.app/?key=YOUR_APP_KEY — the key is remembered and removed from the URL.
  var u = new URL(location.href);
  if (u.searchParams.get('key')) {
    store('appkey', u.searchParams.get('key'));
    history.replaceState(null, '', u.pathname);
  }

  var nf = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 2, minimumFractionDigits: 2 });
  var nf0 = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 0 });
  function money(n) { return (n < 0 ? '−' : '+') + '₹' + nf.format(Math.abs(n)); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
  function cls(n) { return n > 0 ? 'up' : n < 0 ? 'down' : 'dim'; }
  function statusCls(s) {
    if (s === 'complete' || s === 'completed') return 'up';
    if (s === 'rejected' || s === 'cancelled' || s === 'canceled') return 'down';
    return 'warn';
  }

  var data = null, pages = [], idx = 0, error = '';

  function buildPages() {
    pages = [];
    if (!data) return;
    var open = data.positions.filter(function (p) { return p.open; });
    var closed = data.positions.filter(function (p) { return !p.open; });

    pages.push({ title: 'Today', render: function () {
      var openPnl = open.reduce(function (s, p) { return s + p.pnl; }, 0);
      var pending = data.orders.filter(function (o) { return statusCls(o.status) === 'warn'; }).length;
      return '<div class="big"><div class="label">Total P&amp;L</div>' +
        '<div class="value ' + cls(data.totalPnl) + '">' + money(data.totalPnl) + '</div>' +
        '<div class="sub">' + open.length + ' open · ' + closed.length + ' closed</div>' +
        '<div class="sub">' + data.orders.length + ' orders · ' + pending + ' pending</div></div>';
    }});

    var all = open.concat(closed);
    chunk(all, PER_PAGE).forEach(function (items, i, arr) {
      pages.push({ title: 'Positions ' + (i + 1) + '/' + arr.length, render: function () {
        return items.map(function (p) {
          var side = p.qty > 0 ? 'BUY' : p.qty < 0 ? 'SELL' : 'FLAT';
          var meta = p.open
            ? side + ' ' + nf0.format(Math.abs(p.qty)) + ' · avg ' + nf.format(p.avg) + ' · LTP ' + nf.format(p.ltp)
            : 'Closed · ' + esc(p.product || '');
          return '<div class="row"><div class="l"><div class="sym">' + esc(p.symbol) + '</div><div class="meta">' + meta + '</div></div>' +
            '<div class="r"><div class="pnl ' + cls(p.pnl) + '">' + money(p.pnl) + '</div></div></div>';
        }).join('');
      }});
    });
    if (!all.length) pages.push({ title: 'Positions', render: function () { return '<div class="msg">No positions today</div>'; } });

    chunk(data.orders, PER_PAGE).forEach(function (items, i, arr) {
      pages.push({ title: 'Orders ' + (i + 1) + '/' + arr.length, render: function () {
        return items.map(function (o) {
          var priceTxt = o.avg ? 'avg ' + nf.format(o.avg) : (o.price ? '@ ' + nf.format(o.price) : String(o.type || 'MKT'));
          var meta = esc(o.side) + ' ' + nf0.format(o.filled) + '/' + nf0.format(o.qty) + ' · ' + priceTxt + (o.time ? ' · ' + esc(String(o.time).slice(-8, -3)) : '');
          return '<div class="row"><div class="l"><div class="sym">' + esc(o.symbol) + '</div><div class="meta">' + meta + '</div></div>' +
            '<div class="r"><div class="tag ' + statusCls(o.status) + '">' + esc(o.status) + '</div></div></div>';
        }).join('');
      }});
    });
    if (!data.orders.length) pages.push({ title: 'Orders', render: function () { return '<div class="msg">No orders today</div>'; } });
  }

  function chunk(arr, n) { var out = []; for (var i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n)); return out; }

  function render() {
    var main = document.getElementById('main');
    if (error && !data) { main.innerHTML = '<div class="msg down">' + esc(error) + '<br><span class="dim" style="font-size:20px">Tap to retry</span></div>'; return; }
    if (!pages.length) { main.innerHTML = '<div class="msg">Loading…</div>'; return; }
    if (idx >= pages.length) idx = pages.length - 1;
    var p = pages[idx];
    document.getElementById('title').textContent = p.title;
    main.innerHTML = p.render();
    document.getElementById('pager').textContent = (idx + 1) + ' / ' + pages.length;
    var t = data && data.updated ? new Date(data.updated) : null;
    document.getElementById('clock').innerHTML = error ? '<span class="warn">stale</span>' : (t ? t.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }) : '');
  }

  function go(d) { if (!pages.length) { load(); return; } idx = (idx + d + pages.length) % pages.length; render(); }

  function load() {
    fetch('/api/data', { headers: { 'x-app-key': store('appkey') || '' }, cache: 'no-store' })
      .then(function (r) {
        return r.text().then(function (t) {
          var j;
          try { j = JSON.parse(t); } catch (e) {
            throw new Error(r.status === 404 ? 'API not found (404). api/data.js is not deployed.' : 'Bad response (' + r.status + ')');
          }
          if (!r.ok) throw new Error(j.error || 'Error ' + r.status);
          return j;
        });
      })
      .then(function (j) { data = j; error = ''; buildPages(); render(); })
      .catch(function (e) { error = e.message === 'Unauthorized' ? 'Not authorised. Open the app URL with ?key=…' : e.message; render(); });
  }

  // Navigation: tap left/right half, arrow keys, or swipe
  document.addEventListener('click', function (e) { go(e.clientX < window.innerWidth / 2 ? -1 : 1); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ' || e.key === 'Enter') go(1);
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') go(-1);
    else if (e.key === 'r') load();
  });
  var sx = null;
  document.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (sx === null) return;
    var dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) > 40) { go(dx < 0 ? 1 : -1); e.preventDefault(); }
  });

  load();
  setInterval(load, REFRESH_MS);
})();
</script>
</body>
</html>
